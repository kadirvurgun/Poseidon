openapi: 3.1.0
info:
  title: POSEIDON v46.2 Applicability Engine API
  version: 46.2.0
  description: 'Gemi + Römorkör için versioned regulatory applicability evaluation.
    Critical UNKNOWN results in REVIEW_REQUIRED. AI cannot publish or approve legal/safety
    applicability. Controlled candidate contract, not a deployed service or legal
    sign-off. Identity URL is a deployment placeholder. User-approved default/draft
    policy: ambiguous Yes/No values are not defaults; incomplete mandatory information
    can be saved only as draft and must not enter approval or execution.'
servers:
- url: /api/v1
paths:
  /applicability/evaluate:
    post:
      summary: Evaluate applicability for an authoritative context
      operationId: evaluateApplicability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationRequest'
      responses:
        '200':
          description: Evaluation completed
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EvaluationResponse'
                - type: object
                  properties:
                    simulation:
                      const: false
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Scope or role forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Version, approval or material conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      description: Authoritative evaluation MUST reject exampleOnly or non-PUBLISHED
        or source-unverified rule sets; no activation/readiness mutation from draft
        claims. Enforce server-side; this contract is not runtime proof. No ambiguous/prototype
        Yes/No default inference. Approval/execution requires server validation of
        all mandatory and context-conditional inputs; draft persistence alone never
        satisfies this gate.
  /applicability/simulate:
    post:
      summary: Run a non-mutating what-if evaluation
      operationId: simulateApplicability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationRequest'
      responses:
        '200':
          description: Simulation result
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EvaluationResponse'
                - type: object
                  properties:
                    simulation:
                      const: true
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Scope or role forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Version, approval or material conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      description: 'Non-mutating: no evaluation, activation, audit-domain decision
        or readiness state is persisted. Operational request telemetry is permitted.
        No ambiguous/prototype Yes/No default inference. Approval/execution requires
        server validation of all mandatory and context-conditional inputs; draft persistence
        alone never satisfies this gate.'
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CorrelationId'
  /applicability/explain:
    post:
      summary: Explain a rule or readiness result
      operationId: explainApplicability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - evaluationId
              - targetId
              properties:
                evaluationId:
                  type: string
                targetId:
                  type: string
      responses:
        '200':
          description: Reason tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Explanation'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Scope or role forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Version, approval or material conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CorrelationId'
      description: ' No ambiguous/prototype Yes/No default inference. Approval/execution
        requires server validation of all mandatory and context-conditional inputs;
        draft persistence alone never satisfies this gate.'
  /applicability/diff:
    post:
      summary: Compare two dates or rule-set versions for the same context
      operationId: diffApplicability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - context
              - baseline
              - target
              properties:
                context:
                  $ref: '#/components/schemas/ContextSnapshot'
                baseline:
                  $ref: '#/components/schemas/VersionRef'
                target:
                  $ref: '#/components/schemas/VersionRef'
      responses:
        '200':
          description: Impact diff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpactDiff'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Scope or role forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Version, approval or material conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CorrelationId'
      description: ' No ambiguous/prototype Yes/No default inference. Approval/execution
        requires server validation of all mandatory and context-conditional inputs;
        draft persistence alone never satisfies this gate.'
  /rules/validate:
    post:
      summary: Validate a draft rule against schema, semantics and test bindings
      operationId: validateRule
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Scope or role forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Version, approval or material conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rule'
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CorrelationId'
      description: ' No ambiguous/prototype Yes/No default inference. Approval/execution
        requires server validation of all mandatory and context-conditional inputs;
        draft persistence alone never satisfies this gate.'
  /rules/publish:
    post:
      summary: Publish an approved immutable rule version
      description: Requires regulatory approver role and separation-of-duties checks.
        Reject exampleOnly=true or sourceVerificationStatus other than VERIFIED; independent
        human approval and approved regression evidence required. No ambiguous/prototype
        Yes/No default inference. Approval/execution requires server validation of
        all mandatory and context-conditional inputs; draft persistence alone never
        satisfies this gate.
      operationId: publishRule
      responses:
        '200':
          description: Published rule version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePublicationResult'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Scope or role forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Version, approval or material conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulePublicationRequest'
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
components:
  schemas:
    EvaluationRequest:
      type: object
      required:
      - evaluationDate
      - context
      - vessel
      properties:
        evaluationDate:
          type: string
          format: date
        context:
          $ref: '#/components/schemas/ContextSnapshot'
        vessel:
          type: object
          additionalProperties: true
        operation:
          type: object
          additionalProperties: true
        cargo:
          type: object
          additionalProperties: true
        equipment:
          type: object
          additionalProperties: true
        crew:
          type: object
          additionalProperties: true
        regulatory:
          type: object
          additionalProperties: true
        class:
          type: object
          additionalProperties: true
          description: Verified class facts, including rulePack, when known. Missing
            facts remain UNKNOWN.
        ruleSetVersion:
          type: string
          minLength: 1
    ContextSnapshot:
      type: object
      required:
      - tenantId
      - mode
      properties:
        tenantId:
          type: string
        mode:
          type: string
          enum:
          - SHIP
          - TUG
        vesselId:
          type: string
        operationId:
          type: string
        evaluationType:
          type: string
    EvaluationResponse:
      type: object
      required:
      - evaluationId
      - result
      - ruleSetVersion
      - results
      - simulation
      properties:
        evaluationId:
          type: string
        result:
          $ref: '#/components/schemas/ApplicabilityResult'
        ruleSetVersion:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/RuleResult'
        humanReview:
          type: object
          properties:
            required:
              type: boolean
            ownerRole:
              type: string
            reason:
              type: string
        mode:
          type: string
          enum:
          - SHIP
          - TUG
        evaluatedAt:
          type: string
          format: date-time
        summary:
          type: object
          required:
          - applicable
          - notApplicable
          - reviewRequired
          properties:
            applicable:
              type: integer
              minimum: 0
            notApplicable:
              type: integer
              minimum: 0
            reviewRequired:
              type: integer
              minimum: 0
        simulation:
          type: boolean
          description: True outputs are hypothetical and cannot change authoritative
            applicability, activation or readiness.
      description: Aggregate REVIEW_REQUIRED includes human-review obligations even
        where each predicate result is known. Summary counts rule results only; applicability
        does not imply readiness.
    RuleResult:
      type: object
      required:
      - ruleId
      - ruleVersion
      - result
      properties:
        ruleId:
          type: string
        ruleVersion:
          type: integer
          minimum: 1
        result:
          $ref: '#/components/schemas/ApplicabilityResult'
        reasonCode:
          type: string
        predicateTrace:
          type: array
          items:
            type: object
            additionalProperties: true
        activated:
          type: array
          items:
            type: string
        missingInputs:
          type: array
          items:
            type: string
        conflicts:
          type: array
          items:
            type: string
        sourceId:
          type: string
          minLength: 1
        sourceLocator:
          type: string
          minLength: 1
    ApplicabilityResult:
      type: string
      enum:
      - APPLICABLE
      - NOT_APPLICABLE
      - REVIEW_REQUIRED
    Explanation:
      type: object
      properties:
        evaluationId:
          type: string
        targetId:
          type: string
        result:
          $ref: '#/components/schemas/ApplicabilityResult'
        sourceIds:
          type: array
          items:
            type: string
        reasonTree:
          type: array
          items:
            type: object
            additionalProperties: true
        nextActions:
          type: array
          items:
            type: string
    VersionRef:
      type: object
      properties:
        evaluationDate:
          type: string
          format: date
        ruleSetVersion:
          type: string
      anyOf:
      - required:
        - evaluationDate
      - required:
        - ruleSetVersion
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - traceId
      properties:
        type:
          type: string
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        traceId:
          type: string
          minLength: 1
        errors:
          type: object
          additionalProperties: true
    Rule:
      title: POSEIDON v46.2 Applicability Rule
      type: object
      required:
      - ruleId
      - version
      - source
      - lifecycle
      - scope
      - when
      - then
      - unknownPolicy
      properties:
        ruleId:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
        titleTr:
          type: string
        titleEn:
          type: string
        source:
          type: object
          required:
          - sourceId
          - locator
          - authorityLayer
          properties:
            sourceId:
              type: string
            locator:
              type: string
            authorityLayer:
              enum:
              - INTERNATIONAL
              - FLAG
              - CLASS_RO
              - COMPANY_SMS
              - OEM
              - INDUSTRY_ASSURANCE
              - PRODUCT_CONTROL
            mandatory:
              type: boolean
            url:
              type: string
        lifecycle:
          type: object
          required:
          - state
          - effectiveFrom
          properties:
            state:
              enum:
              - DRAFT
              - ADOPTED
              - AWAITING
              - FUTURE_EFFECTIVE
              - IN_FORCE
              - SUPERSEDED
            effectiveFrom:
              type: string
              format: date
            effectiveTo:
              type:
              - string
              - 'null'
              format: date
            supersedes:
              type:
              - string
              - 'null'
        scope:
          type: object
          properties:
            modes:
              type: array
              items:
                enum:
                - SHIP
                - TUG
            flags:
              type: array
              items:
                type: string
            classSocieties:
              type: array
              items:
                type: string
            vesselTypes:
              type: array
              items:
                type: string
            operationTypes:
              type: array
              items:
                type: string
        when:
          $ref: '#/components/schemas/Rule/$defs/expression'
        then:
          type: object
          required:
          - result
          properties:
            result:
              enum:
              - APPLICABLE
              - NOT_APPLICABLE
              - REVIEW_REQUIRED
            activate:
              type: array
              items:
                type: object
                required:
                - type
                - id
                properties:
                  type:
                    enum:
                    - REQUIREMENT
                    - CONTROL
                    - SCREEN
                    - FIELD
                    - EVIDENCE_POLICY
                    - VERIFICATION_GATE
                    - TEST_CASE
                    - NOTIFICATION
                  id:
                    type: string
            stateEffect:
              type:
              - string
              - 'null'
            reasonCode:
              type: string
        unknownPolicy:
          enum:
          - REVIEW_REQUIRED
          - NOT_APPLICABLE
          - FAIL_CLOSED
        priority:
          type: integer
          minimum: 0
        requiresHumanReview:
          type: boolean
        tags:
          type: array
          items:
            type: string
        exampleOnly:
          type: boolean
          description: True rules are illustrative fixtures and MUST NOT enter authoritative
            published rule sets.
        publicationStatus:
          type: string
          enum:
          - DRAFT
          - IN_REVIEW
          - APPROVED
          - PUBLISHED
          description: Authoring workflow independent of legal instrument lifecycle;
            PUBLISHED requires approved source verification and second-person approval.
        sourceVerificationStatus:
          type: string
          enum:
          - PENDING
          - VERIFIED
          - REJECTED
          description: PENDING/REJECTED source claims cannot produce authoritative
            activation or READY. Only non-mutating labelled simulation may show illustrative
            outputs.
      $defs:
        expression:
          oneOf:
          - type: object
            required:
            - all
            properties:
              all:
                type: array
                items:
                  $ref: '#/components/schemas/Rule/$defs/expression'
                minItems: 1
            additionalProperties: false
          - type: object
            required:
            - any
            properties:
              any:
                type: array
                items:
                  $ref: '#/components/schemas/Rule/$defs/expression'
                minItems: 1
            additionalProperties: false
          - type: object
            required:
            - not
            properties:
              not:
                $ref: '#/components/schemas/Rule/$defs/expression'
            additionalProperties: false
          - type: object
            required:
            - field
            - operator
            properties:
              field:
                type: string
                minLength: 1
              operator:
                enum:
                - EQ
                - NE
                - GT
                - GTE
                - LT
                - LTE
                - IN
                - NOT_IN
                - EXISTS
                - IS_TRUE
                - IS_FALSE
                - DATE_GTE
                - DATE_LT
                - CONTAINS
              value: {}
            additionalProperties: false
            allOf:
            - if:
                properties:
                  operator:
                    enum:
                    - EQ
                    - NE
                    - CONTAINS
              then:
                required:
                - value
                properties:
                  value: {}
            - if:
                properties:
                  operator:
                    enum:
                    - GT
                    - GTE
                    - LT
                    - LTE
              then:
                required:
                - value
                properties:
                  value:
                    type: number
            - if:
                properties:
                  operator:
                    enum:
                    - IN
                    - NOT_IN
              then:
                required:
                - value
                properties:
                  value:
                    type: array
                    minItems: 1
            - if:
                properties:
                  operator:
                    enum:
                    - DATE_GTE
                    - DATE_LT
              then:
                required:
                - value
                properties:
                  value:
                    type: string
                    format: date
            - if:
                properties:
                  operator:
                    enum:
                    - EXISTS
                    - IS_TRUE
                    - IS_FALSE
              then:
                not:
                  required:
                  - value
      description: Controlled candidate DSL; structural validity is not legal/source
        approval. Publication additionally requires semantic validation, binding validation,
        golden tests and independent human approval.
      allOf:
      - if:
          required:
          - publicationStatus
          properties:
            publicationStatus:
              const: PUBLISHED
        then:
          required:
          - exampleOnly
          - sourceVerificationStatus
          properties:
            exampleOnly:
              const: false
            sourceVerificationStatus:
              const: VERIFIED
    ValidationResult:
      type: object
      required:
      - valid
      - errors
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Problem'
    RulePublicationRequest:
      type: object
      required:
      - ruleId
      - version
      - approvalId
      properties:
        ruleId:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
        approvalId:
          type: string
          minLength: 1
      description: References an independently approved immutable draft; actor/approver
        identity is resolved server-side, never trusted from request fields.
    RulePublicationResult:
      type: object
      required:
      - ruleId
      - version
      properties:
        ruleId:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
    ImpactDiff:
      type: object
      required:
      - baseline
      - target
      - changes
      properties:
        baseline:
          $ref: '#/components/schemas/VersionRef'
        target:
          $ref: '#/components/schemas/VersionRef'
        changes:
          type: array
          items:
            type: object
            additionalProperties: true
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.example.com/.well-known/openid-configuration
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: Context hint only; must match server-authorized token scope.
      schema:
        type: string
        minLength: 1
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
security:
- oidc: []
x-approved-default-and-draft-policy:
  status: USER_APPROVED_BUSINESS_POLICY
  approvedAt: '2026-10-27T11:22:16Z'
  rules:
  - Ambiguous source Yes/No strings are never inferred as defaults. Only explicitly
    defined or server-calculated defaults are permitted.
  - Incomplete mandatory information may be persisted as a draft, but cannot be submitted
    for approval or execution.
  - Saving a draft does not authorize, approve, verify, activate a requirement, or
    establish READY.
  - Known supplied values still undergo type/format and authorization checks; draft
    does not permit arbitrary or server-owned fields.
  runtimeEnforcement: NOT_VERIFIED
  wireMapping: Candidate tagged draft envelopes on existing typed resource POSTs;
    no new endpoint is introduced.
