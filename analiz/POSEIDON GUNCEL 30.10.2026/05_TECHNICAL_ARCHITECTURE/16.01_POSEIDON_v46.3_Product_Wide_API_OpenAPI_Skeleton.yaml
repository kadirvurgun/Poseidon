openapi: 3.1.0
info:
  title: POSEIDON v46.3 Product-Wide API
  version: 46.3.0
  description: 'GEMİ + RÖMORKÖR canonical domain API skeleton. v46.3 adds Ship Operations
    2.0, PMS/Assurance and Risk benchmark delta while preserving ERP/Port boundaries.
    Controlled candidate skeleton: generic domain DTOs remain explicit refinement
    gaps and are not production-certified contracts. User-approved default/draft policy:
    ambiguous Yes/No values are not defaults; incomplete mandatory information can
    be saved only as draft and must not enter approval or execution.'
servers:
- url: https://api.poseidon.example.com
security:
- oidc: []
tags:
- name: Vessels
- name: Crew
- name: ShipOperations
- name: TugOperations
- name: Technical
- name: Safety
- name: Assurance
- name: Regulatory
- name: Knowledge
- name: Evidence
- name: Integration
- name: Readiness
- name: UIProjection
- name: DailyOperations
- name: FuelBunker
- name: SurveyReadiness
- name: RiskTemplates
paths:
  /api/v1/vessels:
    get:
      tags:
      - Vessels
      summary: Fleet/vessel search and create
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CorrelationId'
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VesselReadPage'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Scope or role forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Concurrency / material conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      operationId: getVessels
    post:
      tags:
      - Vessels
      summary: Fleet/vessel search and create - create/command boundary
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/VesselWrite'
              - $ref: '#/components/schemas/VesselDraftSave'
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/VesselRead'
                - $ref: '#/components/schemas/DraftSaved'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Scope or role forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Concurrency / material conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      operationId: postVessels
      description: ' No ambiguous/prototype Yes/No default inference. Approval/execution
        requires server validation of all mandatory and context-conditional inputs;
        draft persistence alone never satisfies this gate. Explicit saveMode=DRAFT
        envelope may persist incomplete data and returns DraftSaved only. The unwrapped
        validated resource request remains subject to all required/contextual checks.
        A draft cannot be promoted merely by omitting saveMode: full validation and
        authorized workflow checks are mandatory.'
  /api/v1/vessels/{vesselId}:
    get:
      tags:
      - Vessels
      summary: Vessel aggregate
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CorrelationId'
      - name: vesselId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VesselRead'
          headers:
            ETag:
              description: Strong aggregate version for subsequent If-Match.
              schema:
                type: string
                minLength: 1
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Scope or role forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Concurrency / material conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Resource not found within authorized scope
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      operationId: getVesselsVesselId
    post:
      tags:
      - Vessels
      summary: Vessel aggregate - create/command boundary
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: vesselId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/VesselWrite'
              - $ref: '#/components/schemas/VesselDraftSave'
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/VesselRead'
                - $ref: '#/components/schemas/DraftSaved'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Scope or role forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Concurrency / material conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Resource not found within authorized scope
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: ETag precondition failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      operationId: postVesselsVesselId
      description: ' No ambiguous/prototype Yes/No default inference. Approval/execution
        requires server validation of all mandatory and context-conditional inputs;
        draft persistence alone never satisfies this gate. Explicit saveMode=DRAFT
        envelope may persist incomplete data and returns DraftSaved only. The unwrapped
        validated resource request remains subject to all required/contextual checks.
        A draft cannot be promoted merely by omitting saveMode: full validation and
        authorized workflow checks are mandatory.'
