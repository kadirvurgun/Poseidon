                  tug-readiness: TugReadiness
                  tug-equipment-readiness: TugEquipmentReadiness
                  tug-crew-readiness: TugCrewReadiness
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Scope or role forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Concurrency / material conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Resource not found within authorized scope
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      operationId: getUiProjectionsScreenId
      description: For the three mapped tug screen IDs, the server MUST validate its
        response against the named schema in x-screen-schema-map. The generic fallback
        is only for other screens; OpenAPI cannot condition a response schema directly
        on a path parameter. Never use projection writes to bypass canonical command
        authorization.
