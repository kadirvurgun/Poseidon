components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.example.com/.well-known/openid-configuration
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/EntityId'
      description: Context hint only; server must enforce token tenant/company/vessel
        scope.
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema:
        type: string
        maxLength: 120
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 120
      description: Same key and payload replay same result; same key with different
        payload is a conflict. No silent duplicate state transition.
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Last-known strong aggregate ETag; mismatch must not mutate state.
      schema:
        type: string
        minLength: 1
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - traceId
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        traceId:
          type: string
        errors:
          type: object
          additionalProperties: true
    CommandAccepted:
      type: object
      required:
      - commandId
      - status
      properties:
        commandId:
          $ref: '#/components/schemas/EntityId'
        status:
          type: string
          enum:
          - ACCEPTED
      description: 202 means accepted only, never completed, verified, approved or
        READY.
    Readiness:
      type: object
      required:
      - state
      - why
      properties:
        state:
          type: string
          enum:
          - READY
          - CONDITIONAL
          - NOT_READY
          - REVIEW_REQUIRED
        why:
          type: array
          items:
            type: object
            additionalProperties: true
    EvidenceRef:
      type: object
      properties:
        evidenceId:
          $ref: '#/components/schemas/EntityId'
        verificationState:
          type: string
          enum:
          - PENDING
          - VERIFIED
          - REJECTED
          - EXPIRED
          - SUPERSEDED
        storageRef:
          type: string
    EvaluationRequest:
      type: object
      required:
      - evaluationDate
      - context
      - vessel
      properties:
        evaluationDate:
          type: string
          format: date
        context:
          $ref: '#/components/schemas/ContextSnapshot'
        vessel:
          type: object
          additionalProperties: true
        operation:
          type: object
          additionalProperties: true
        cargo:
          type: object
          additionalProperties: true
        equipment:
          type: object
          additionalProperties: true
        crew:
          type: object
          additionalProperties: true
        regulatory:
          type: object
          additionalProperties: true
        class:
          type: object
          additionalProperties: true
          description: Verified class facts, including rulePack, when known. Missing
            facts remain UNKNOWN.
        ruleSetVersion:
          type: string
          minLength: 1
    ContextSnapshot:
      type: object
      required:
      - tenantId
      - mode
      properties:
        tenantId:
          type: string
        mode:
          type: string
          enum:
          - SHIP
          - TUG
        vesselId:
          type: string
        operationId:
          type: string
        evaluationType:
          type: string
    EvaluationResponse:
      type: object
      required:
      - evaluationId
      - result
      - ruleSetVersion
      - results
      - simulation
      properties:
        evaluationId:
          type: string
        result:
          $ref: '#/components/schemas/ApplicabilityResult'
        ruleSetVersion:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/RuleResult'
        humanReview:
          type: object
          properties:
            required:
              type: boolean
            ownerRole:
              type: string
            reason:
              type: string
        mode:
          type: string
          enum:
          - SHIP
          - TUG
        evaluatedAt:
          type: string
          format: date-time
        summary:
          type: object
          required:
          - applicable
          - notApplicable
          - reviewRequired
          properties:
            applicable:
              type: integer
              minimum: 0
            notApplicable:
              type: integer
              minimum: 0
            reviewRequired:
              type: integer
              minimum: 0
        simulation:
          type: boolean
          description: True outputs are hypothetical and cannot change authoritative
            applicability, activation or readiness.
      description: Aggregate REVIEW_REQUIRED includes human-review obligations even
        where each predicate result is known. Summary counts rule results only; applicability
        does not imply readiness.
    RuleResult:
      type: object
      required:
      - ruleId
      - ruleVersion
      - result
      properties:
        ruleId:
          type: string
        ruleVersion:
          type: integer
          minimum: 1
        result:
          $ref: '#/components/schemas/ApplicabilityResult'
        reasonCode:
          type: string
        predicateTrace:
          type: array
          items:
            type: object
            additionalProperties: true
        activated:
          type: array
          items:
            type: string
        missingInputs:
          type: array
          items:
            type: string
        conflicts:
          type: array
          items:
            type: string
        sourceId:
          type: string
          minLength: 1
        sourceLocator:
          type: string
          minLength: 1
    ApplicabilityResult:
      type: string
      enum:
      - APPLICABLE
      - NOT_APPLICABLE
      - REVIEW_REQUIRED
    Explanation:
      type: object
      properties:
        evaluationId:
          type: string
        targetId:
          type: string
        result:
          $ref: '#/components/schemas/ApplicabilityResult'
        sourceIds:
          type: array
          items:
            type: string
        reasonTree:
          type: array
          items:
            type: object
            additionalProperties: true
        nextActions:
          type: array
          items:
            type: string
    VersionRef:
      type: object
      properties:
        evaluationDate:
          type: string
          format: date
        ruleSetVersion:
          type: string
      anyOf:
      - required:
        - evaluationDate
      - required:
        - ruleSetVersion
    Rule:
      title: POSEIDON v46.2 Applicability Rule
      type: object
      required:
      - ruleId
      - version
      - source
      - lifecycle
      - scope
      - when
      - then
      - unknownPolicy
      properties:
        ruleId:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
        titleTr:
          type: string
        titleEn:
          type: string
        source:
          type: object
          required:
          - sourceId
          - locator
          - authorityLayer
          properties:
            sourceId:
              type: string
            locator:
              type: string
            authorityLayer:
              enum:
              - INTERNATIONAL
              - FLAG
              - CLASS_RO
              - COMPANY_SMS
              - OEM
              - INDUSTRY_ASSURANCE
              - PRODUCT_CONTROL
            mandatory:
              type: boolean
            url:
              type: string
        lifecycle:
          type: object
          required:
          - state
          - effectiveFrom
          properties:
            state:
              enum:
              - DRAFT
              - ADOPTED
              - AWAITING
              - FUTURE_EFFECTIVE
              - IN_FORCE
              - SUPERSEDED
            effectiveFrom:
              type: string
              format: date
            effectiveTo:
              type:
              - string
              - 'null'
              format: date
            supersedes:
              type:
              - string
              - 'null'
        scope:
          type: object
          properties:
            modes:
              type: array
              items:
                enum:
                - SHIP
                - TUG
            flags:
              type: array
              items:
                type: string
            classSocieties:
              type: array
              items:
                type: string
            vesselTypes:
              type: array
              items:
                type: string
            operationTypes:
              type: array
              items:
                type: string
        when:
          $ref: '#/components/schemas/Rule/$defs/expression'
        then:
          type: object
          required:
          - result
          properties:
            result:
              enum:
              - APPLICABLE
              - NOT_APPLICABLE
              - REVIEW_REQUIRED
            activate:
              type: array
              items:
                type: object
                required:
                - type
                - id
                properties:
                  type:
                    enum:
                    - REQUIREMENT
                    - CONTROL
                    - SCREEN
                    - FIELD
                    - EVIDENCE_POLICY
                    - VERIFICATION_GATE
                    - TEST_CASE
                    - NOTIFICATION
                  id:
                    type: string
            stateEffect:
              type:
              - string
              - 'null'
            reasonCode:
              type: string
        unknownPolicy:
          enum:
          - REVIEW_REQUIRED
          - NOT_APPLICABLE
          - FAIL_CLOSED
        priority:
          type: integer
          minimum: 0
        requiresHumanReview:
          type: boolean
        tags:
          type: array
          items:
            type: string
        exampleOnly:
          type: boolean
          description: True rules are illustrative fixtures and MUST NOT enter authoritative
            published rule sets.
        publicationStatus:
          type: string
          enum:
          - DRAFT
          - IN_REVIEW
          - APPROVED
          - PUBLISHED
          description: Authoring workflow independent of legal instrument lifecycle;
            PUBLISHED requires approved source verification and second-person approval.
        sourceVerificationStatus:
          type: string
          enum:
          - PENDING
          - VERIFIED
          - REJECTED
          description: PENDING/REJECTED source claims cannot produce authoritative
            activation or READY. Only non-mutating labelled simulation may show illustrative
            outputs.
      $defs:
        expression:
          oneOf:
          - type: object
            required:
            - all
            properties:
              all:
                type: array
                items:
                  $ref: '#/components/schemas/Rule/$defs/expression'
                minItems: 1
            additionalProperties: false
          - type: object
            required:
            - any
            properties:
              any:
                type: array
                items:
                  $ref: '#/components/schemas/Rule/$defs/expression'
                minItems: 1
            additionalProperties: false
          - type: object
            required:
            - not
            properties:
              not:
                $ref: '#/components/schemas/Rule/$defs/expression'
            additionalProperties: false
          - type: object
            required:
            - field
            - operator
            properties:
              field:
                type: string
                minLength: 1
              operator:
                enum:
                - EQ
                - NE
                - GT
                - GTE
                - LT
                - LTE
                - IN
                - NOT_IN
                - EXISTS
                - IS_TRUE
                - IS_FALSE
                - DATE_GTE
                - DATE_LT
                - CONTAINS
              value: {}
            additionalProperties: false
            allOf:
            - if:
                properties:
                  operator:
                    enum:
                    - EQ
                    - NE
                    - CONTAINS
              then:
                required:
                - value
                properties:
                  value: {}
            - if:
                properties:
                  operator:
                    enum:
                    - GT
                    - GTE
                    - LT
                    - LTE
              then:
                required:
                - value
                properties:
                  value:
                    type: number
            - if:
                properties:
                  operator:
                    enum:
                    - IN
                    - NOT_IN
              then:
                required:
                - value
                properties:
                  value:
                    type: array
                    minItems: 1
            - if:
                properties:
                  operator:
                    enum:
                    - DATE_GTE
                    - DATE_LT
              then:
                required:
                - value
                properties:
                  value:
                    type: string
                    format: date
            - if:
                properties:
                  operator:
                    enum:
                    - EXISTS
                    - IS_TRUE
                    - IS_FALSE
              then:
                not:
                  required:
                  - value
      description: Controlled candidate DSL; structural validity is not legal/source
        approval. Publication additionally requires semantic validation, binding validation,
        golden tests and independent human approval.
      allOf:
      - if:
          required:
          - publicationStatus
          properties:
            publicationStatus:
              const: PUBLISHED
        then:
          required:
          - exampleOnly
          - sourceVerificationStatus
          properties:
            exampleOnly:
              const: false
            sourceVerificationStatus:
              const: VERIFIED
    ValidationResult:
      type: object
      required:
      - valid
      - errors
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Problem'
    RulePublicationRequest:
      type: object
      required:
      - ruleId
      - version
      - approvalId
      properties:
        ruleId:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
        approvalId:
          type: string
          minLength: 1
      description: References an independently approved immutable draft; actor/approver
        identity is resolved server-side, never trusted from request fields.
    RulePublicationResult:
      type: object
      required:
      - ruleId
      - version
      properties:
        ruleId:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
    ImpactDiff:
      type: object
      required:
      - baseline
      - target
      - changes
      properties:
        baseline:
          $ref: '#/components/schemas/VersionRef'
        target:
          $ref: '#/components/schemas/VersionRef'
        changes:
          type: array
          items:
            type: object
            additionalProperties: true
    EntityId:
      type: string
      minLength: 1
      description: Opaque UUID/ULID-compatible identifier. Exact key policy remains
        a controlled implementation decision; no UUID-only restriction.
      x-source: 14.01 §6
    VesselWrite:
      type: object
      additionalProperties: false
      properties:
        company_id:
          $ref: '#/components/schemas/EntityId'
        name:
          type: string
          minLength: 1
        imo_no:
          type: string
          minLength: 1
          pattern: ^[0-9]{7}$
          description: Optional IMO number; applicability to vessel type is not inferred.
            Seven-digit format only; check-digit verification remains server-side.
        official_no:
          type: string
          minLength: 1
        flag:
          type: string
          minLength: 1
        vessel_type:
          type: string
          minLength: 1
      required:
      - company_id
      - name
      - flag
      - vessel_type
      description: Canonical root creation/update fields, not the fleet screen form.
        Tenant, identity and lifecycle status are server-owned; no arbitrary fields
        accepted.
      x-source: 14.01 §4 canonical entity fields; §6 keys/time; 14.02 source field
        dictionary; 15.01 canonical API boundaries
    VesselRead:
      type: object
      additionalProperties: false
      properties:
        company_id:
          $ref: '#/components/schemas/EntityId'
        name:
          type: string
          minLength: 1
        imo_no:
          type: string
          minLength: 1
          pattern: ^[0-9]{7}$
          description: Optional IMO number; applicability to vessel type is not inferred.
            Seven-digit format only; check-digit verification remains server-side.
        official_no:
          type: string
          minLength: 1
        flag:
          type: string
          minLength: 1
        vessel_type:
          type: string
          minLength: 1
        id:
          $ref: '#/components/schemas/EntityId'
        tenant_id:
          $ref: '#/components/schemas/EntityId'
        status:
          type: string
          readOnly: true
          description: Source status catalogue is not frozen; do not infer a state-transition
            enum from UI labels.
        profile:
          $ref: '#/components/schemas/VesselProfile'
        tug_profile:
          $ref: '#/components/schemas/TugProfileKnownFields'
      required:
      - id
      - tenant_id
      - company_id
      - name
      - flag
      - vessel_type
      - status
      x-source: 14.01 §4 canonical entity fields; §6 keys/time; 14.02 source field
        dictionary; 15.01 canonical API boundaries
      description: Canonical vessel aggregate with optional linked profile read models;
        nesting is a candidate DTO mapping of the source Vessel/VesselProfile/TugProfile
        relationship. Tug capability configuration fields remain pending controlled
        type approval.
    VesselProfile:
      type: object
      additionalProperties: false
      properties:
        vessel_id:
          $ref: '#/components/schemas/EntityId'
        gt:
          type: number
          minimum: 0
        nt:
          type: number
          minimum: 0
        dwt:
          type: number
          minimum: 0
        loa:
          type: number
          minimum: 0
        breadth:
          type: number
          minimum: 0
        draft:
          type: number
          minimum: 0
        build_date:
          type: string
          format: date
