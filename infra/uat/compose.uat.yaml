# POSEIDON UAT stack (single VPS). SYNTHETIC DATA ONLY: never load real vessel/crew/person data here.
# Lives at /opt/poseidon-uat/compose.uat.yaml on the VPS; deploy.sh supplies POSEIDON_TAG.
# Generated on the VPS, never committed: .env, secrets/*.env, secrets/postgres-password, config/*.json, keycloak/realm/*.json
# (python3 manage.py init creates them).
name: poseidon-uat

services:
  web:
    image: ghcr.io/kadirvurgun/poseidon-web:${POSEIDON_TAG:?set POSEIDON_TAG}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      UAT_DOMAIN: ${UAT_DOMAIN:?set UAT_DOMAIN}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        # The API reaches the OIDC authority through the public hostname; resolve it to Caddy
        # inside the network so the backchannel uses the same trusted certificate.
        aliases: ["${UAT_DOMAIN}"]
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_started
    mem_limit: 256m

  api:
    image: ghcr.io/kadirvurgun/poseidon-api:${POSEIDON_TAG}
    restart: unless-stopped
    # No published ports: forwarded headers are trusted, so only Caddy may reach the API.
    env_file:
      - secrets/db.env
      - secrets/api.env
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      AllowedHosts: ${UAT_DOMAIN}
    volumes:
      - ./config/appsettings.Staging.json:/app/appsettings.Staging.json:ro
      - dataprotection-keys:/var/lib/poseidon/keys
    networks: [edge, data]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1536m

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    restart: unless-stopped
    command: ["start", "--import-realm"]
    env_file:
      - secrets/keycloak.env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: https://${UAT_DOMAIN}/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=70"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    networks: [edge, data]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g

  postgres:
    image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    restart: unless-stopped
    environment:
      POSTGRES_DB: poseidon
      POSTGRES_USER: poseidon
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      KEYCLOAK_DB_PASSWORD_FILE: /run/secrets/keycloak_db_password
    secrets: [postgres_password, keycloak_db_password]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poseidon -d poseidon"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256m
    mem_limit: 1536m

  # One-shot: `docker compose run --rm migrator` (deploy.sh runs it before `up`).
  migrator:
    image: ghcr.io/kadirvurgun/poseidon-migrator:${POSEIDON_TAG}
    profiles: ["ops"]
    env_file:
      - secrets/db.env
    environment:
      DOTNET_ENVIRONMENT: Production
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

secrets:
  postgres_password:
    file: ./secrets/postgres-password
  keycloak_db_password:
    file: ./secrets/keycloak-db-password

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  dataprotection-keys:

networks:
  edge:
  data:
    internal: true
