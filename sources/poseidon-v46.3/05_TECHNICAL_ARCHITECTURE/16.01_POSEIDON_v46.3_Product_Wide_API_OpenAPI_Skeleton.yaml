                additionalProperties: true
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.example.com/.well-known/openid-configuration
  parameters:
    TenantId:
