openapi: 3.1.0
info:
  title: POSEIDON v46.2 Applicability Engine API
  version: 46.2.0
  description: >-
    Gemi + Römorkör için versioned regulatory applicability evaluation.
    Critical UNKNOWN results in REVIEW_REQUIRED. AI cannot publish or approve legal/safety applicability.
servers:
  - url: /api/v1
paths:
  /applicability/evaluate:
    post:
      summary: Evaluate applicability for an authoritative context
      operationId: evaluateApplicability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationRequest'
      responses:
        '200':
          description: Evaluation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResponse'
  /applicability/simulate:
    post:
      summary: Run a non-mutating what-if evaluation
      operationId: simulateApplicability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationRequest'
      responses:
        '200':
          description: Simulation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResponse'
  /applicability/explain:
    post:
      summary: Explain a rule or readiness result
      operationId: explainApplicability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evaluationId, targetId]
              properties:
                evaluationId: {type: string}
                targetId: {type: string}
      responses:
        '200':
          description: Reason tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Explanation'
  /applicability/diff:
    post:
      summary: Compare two dates or rule-set versions for the same context
      operationId: diffApplicability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context, baseline, target]
              properties:
                context: {$ref: '#/components/schemas/ContextSnapshot'}
                baseline: {$ref: '#/components/schemas/VersionRef'}
                target: {$ref: '#/components/schemas/VersionRef'}
      responses:
        '200':
          description: Impact diff
  /rules/validate:
    post:
      summary: Validate a draft rule against schema, semantics and test bindings
      operationId: validateRule
      responses:
        '200': {description: Validation result}
  /rules/publish:
    post:
      summary: Publish an approved immutable rule version
      description: Requires regulatory approver role and separation-of-duties checks.
      operationId: publishRule
      responses:
        '200': {description: Published rule version}
components:
  schemas:
    EvaluationRequest:
      type: object
      required: [evaluationDate, context, vessel]
      properties:
        evaluationDate: {type: string, format: date}
        context: {$ref: '#/components/schemas/ContextSnapshot'}
        vessel: {type: object, additionalProperties: true}
        operation: {type: object, additionalProperties: true}
        cargo: {type: object, additionalProperties: true}
        equipment: {type: object, additionalProperties: true}
        crew: {type: object, additionalProperties: true}
        regulatory: {type: object, additionalProperties: true}
    ContextSnapshot:
      type: object
      required: [tenantId, mode]
      properties:
        tenantId: {type: string}
        mode: {type: string, enum: [SHIP, TUG]}
        vesselId: {type: string}
        operationId: {type: string}
        evaluationType: {type: string}
    EvaluationResponse:
      type: object
      required: [evaluationId, result, ruleSetVersion, results]
      properties:
        evaluationId: {type: string}
        result: {$ref: '#/components/schemas/ApplicabilityResult'}
        ruleSetVersion: {type: string}
        results:
          type: array
          items: {$ref: '#/components/schemas/RuleResult'}
        humanReview:
          type: object
          properties:
            required: {type: boolean}
            ownerRole: {type: string}
            reason: {type: string}
    RuleResult:
      type: object
      required: [ruleId, ruleVersion, result]
      properties:
        ruleId: {type: string}
        ruleVersion: {type: integer}
        result: {$ref: '#/components/schemas/ApplicabilityResult'}
        reasonCode: {type: string}
        predicateTrace: {type: array, items: {type: object, additionalProperties: true}}
        activated: {type: array, items: {type: string}}
        missingInputs: {type: array, items: {type: string}}
        conflicts: {type: array, items: {type: string}}
    ApplicabilityResult:
      type: string
      enum: [APPLICABLE, NOT_APPLICABLE, REVIEW_REQUIRED]
    Explanation:
      type: object
      properties:
        evaluationId: {type: string}
        targetId: {type: string}
        result: {$ref: '#/components/schemas/ApplicabilityResult'}
        sourceIds: {type: array, items: {type: string}}
        reasonTree: {type: array, items: {type: object, additionalProperties: true}}
        nextActions: {type: array, items: {type: string}}
    VersionRef:
      type: object
      properties:
        evaluationDate: {type: string, format: date}
        ruleSetVersion: {type: string}
