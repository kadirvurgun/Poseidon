name: Application foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-automation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify Windows scheduler construction without registration
        run: python -m unittest discover -s scripts -p windows_scheduler_checks.py -v

  persistence-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Scan every tracked repository input including controlled documents
        env:
          POSEIDON_SOURCE_REVIEW_SHA256: ${{ vars.POSEIDON_SOURCE_REVIEW_SHA256 }}
        run: python3 scripts/reviewed_secret_scan.py --mode repository
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Restore locked packages and tools
        run: |
          dotnet tool restore
          dotnet restore Poseidon.slnx --locked-mode
      - name: Build
        run: dotnet build Poseidon.slnx --configuration Release --no-restore
      - name: Unit tests
        run: |
          dotnet test --project tests/Poseidon.Persistence.Tests/Poseidon.Persistence.Tests.csproj --configuration Release --no-build --filter-not-trait "Category=Integration"
          dotnet test --project tests/Poseidon.Domain.Tests/Poseidon.Domain.Tests.csproj --configuration Release --no-build
          python3 scripts/api_test_gate.py --scope unit
      - name: Build pinned source S3 provider for actual API integration
        run: |
          mkdir -p .runtime
          docker build --iidfile .runtime/s3-gate-image-id --file infra/s3-gate/Dockerfile infra/s3-gate
      - name: Start pinned real loopback ClamAV for the integrated file gate
        run: |
          python3 scripts/clamd_gate.py start --state .runtime/clamd-gate.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          state = json.loads(Path('.runtime/clamd-gate.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"POSEIDON_GATE_CLAMD_PORT={state['port']}\n")
          PY
      - name: PostgreSQL integration tests
        run: |
          dotnet test --project tests/Poseidon.Persistence.Tests/Poseidon.Persistence.Tests.csproj --configuration Release --no-build --filter-trait "Category=Integration"
          python3 scripts/s3_gate.py --image "$(cat .runtime/s3-gate-image-id)" --child-timeout 1860 -- python3 scripts/api_test_gate.py --scope integration
      - name: Remove only the owned scanner
        if: always()
        run: |
          if [ -f .runtime/clamd-gate.json ]; then
            python3 scripts/clamd_gate.py stop --state .runtime/clamd-gate.json
          fi
      - name: Check migration model
        run: dotnet ef migrations has-pending-model-changes --context PoseidonDbContext --project backend/Poseidon.Persistence --startup-project backend/Poseidon.DbMigrator --configuration Release --no-build
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: api-test-counts
          path: .runtime/api-gate/*.json
          if-no-files-found: ignore
      - name: Document import tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Verify current analysis byte hashes and chunk lineage
        run: python3 scripts/verify_sources.py
      - name: Publish API artifact
        run: dotnet publish backend/Poseidon.Api --configuration Release --no-build --no-restore --output .runtime/artifacts/api
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: api-development-build
          path: .runtime/artifacts/api
          if-no-files-found: error

  frontend-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/Poseidon.Browser.Tests/package-lock.json
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Restore frontend and browser packages
        run: |
          npm ci --prefix frontend
          npm ci --prefix tests/Poseidon.Browser.Tests
      - name: Lint and typecheck
        run: |
          npm run generate:api --prefix frontend
          git diff --exit-code -- frontend/src/generated/api.d.ts
          npm run lint --prefix frontend
          npm run typecheck --prefix frontend
      - name: Component tests
        run: npm test --prefix frontend
      - name: Build frontend and real API
        run: |
          npm run build --prefix frontend
          dotnet restore backend/Poseidon.Api --locked-mode
          dotnet build backend/Poseidon.Api --configuration Release --no-restore
          dotnet restore backend/Poseidon.DbMigrator --locked-mode
          dotnet build backend/Poseidon.DbMigrator --configuration Release --no-restore
      - name: Scan actual frontend production output
        env:
          POSEIDON_SOURCE_REVIEW_SHA256: ${{ vars.POSEIDON_SOURCE_REVIEW_SHA256 }}
        run: python3 scripts/reviewed_secret_scan.py --mode client --bundle frontend/dist
      - name: Install Chromium
        working-directory: tests/Poseidon.Browser.Tests
        run: npx playwright install --with-deps chromium
      - name: Real API browser smoke (desktop and mobile)
        run: python3 scripts/browser_gate.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-development-build
          path: frontend/dist
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: playwright-evidence
          path: |
            tests/Poseidon.Browser.Tests/playwright-report
            tests/Poseidon.Browser.Tests/test-results
          retention-days: 14
  nightly-installer-construction:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'
      - name: Construct nightly ScheduledTask in Preview only
        run: python scripts/windows_nightly_checks.py -v
      - name: Construct persistent runtime and quota wake tasks in Preview only
        run: python scripts/windows_ops_checks.py -v
